name: Create Benchmark Snapshot

on:
  workflow_dispatch: {}

jobs:
  create-snapshot:
    name: create snapshot
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: depot/snapshot-action@v0.2.0
        with:
          image: ${{ vars.BENCHMARK_SNAPSHOT_IMAGE }}
